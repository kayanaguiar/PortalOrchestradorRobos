services:
  # PostgreSQL
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robocommand
      POSTGRES_USER: robocommand
      POSTGRES_PASSWORD: ${DB_PASSWORD:-robocommand123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robocommand"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://robocommand:${DB_PASSWORD:-robocommand123}@db:5432/robocommand
      UIPATH_TOKEN_URL: https://cloud.uipath.com/identity_/connect/token
      JWT_SECRET: ${JWT_SECRET:-robocommand-dev-only-change-in-production}
    volumes:
      - ./server/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3001/api/ping', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Frontend Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  pgdata:
