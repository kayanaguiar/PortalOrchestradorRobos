# ─── HTTP (sempre ativo) ─────────────────────────
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend
    location /api/ {
        # Resolver do Docker + proxy_pass via variável: força o nginx a re-resolver
        # o IP do backend em runtime (cache 10s). Sem isso, o IP é fixado no boot e
        # o frontend dá 502 quando o container do backend reinicia com IP novo.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
